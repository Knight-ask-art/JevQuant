apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-api
  namespace: jev-trading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jev-api
  template:
    metadata:
      labels:
        app: jev-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: jev-trading-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jev-config
            - secretRef:
                name: jev-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: jev-api
  namespace: jev-trading
spec:
  selector:
    app: jev-api
  ports:
    - port: 8000
      targetPort: 8000
