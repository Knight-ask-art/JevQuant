apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jev
  namespace: jev-trading
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: jev.example.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jev-api
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: jev-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jev-web
                port:
                  number: 80
