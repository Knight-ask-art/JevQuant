apiVersion: apps/v1
kind: Deployment
metadata:
  name: jev-web
  namespace: jev-trading
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jev-web
  template:
    metadata:
      labels:
        app: jev-web
    spec:
      containers:
        - name: web
          image: jev-trading-web:0.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jev-web
  namespace: jev-trading
spec:
  selector:
    app: jev-web
  ports:
    - port: 80
      targetPort: 80
